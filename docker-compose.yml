services:
  gateway:
    build: .
    container_name: bisheng-gateway
    ports: ["${PORT:-8000}:${PORT:-8000}"]
    volumes:
      # 挂载日志目录到宿主机以便持久化与采集
      - ./logs:/app/backend/logs
    environment:
      # 应用基础配置
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_NAME: ${APP_NAME:-Bisheng Gateway}
      PORT: ${PORT:-8000}
      HOST: ${HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # 数据库配置（必需生产环境配置）
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./gateway.db}
      DB_REQUIRED: ${DB_REQUIRED:-false}
      DB_AUTO_CREATE: ${DB_AUTO_CREATE:-true}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      
      # Redis 缓存配置
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-86400}
      
      # JWT & 安全配置
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      
      # 上游 API 配置
      EXTERNAL_API_URL: ${EXTERNAL_API_URL:-https://router.fis.aliyuncs.com/finx/api}
      EXTERNAL_API_KEY: ${EXTERNAL_API_KEY}
      
      # CORS 配置
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      
      # 性能与限流配置
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      RATE_LIMIT: ${RATE_LIMIT:-60/minute}
      
      # 安全审核配置
      SAFETY_FILTER_ENABLED: ${SAFETY_FILTER_ENABLED:-true}
      SAFETY_BASE_URL: ${SAFETY_BASE_URL}
      SAFETY_APPKEY: ${SAFETY_APPKEY}
      SAFETY_SECRET_KEY: ${SAFETY_SECRET_KEY}
      
    env_file:
      # 本地开发可在 backend/.env 配置；不会入镜
      - path: backend/.env
        required: false
    
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${PORT:-8000}/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    
    restart: unless-stopped
